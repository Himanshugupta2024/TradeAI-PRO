name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (exclude integration) with coverage
        run: |
          pytest -m "not integration" --tb=short -q || { echo "=== FAILED TESTS SUMMARY ==="; pytest -m "not integration" --tb=short --last-failed; exit 1; }

      # A missing module once shipped because no test imports the app itself:
      # api/app.py referenced api.cycle_scheduler, the file was never committed,
      # and two Render deploys failed their health check. This catches that class
      # of breakage in ~20 seconds instead of after a failed production deploy.
      - name: Import smoke — the API must boot
        env:
          LOG_DIR: ${{ runner.temp }}/logs
          LIGHTWEIGHT_API_MODE: "true"
          BACKGROUND_REFRESH_ENABLED: "false"
        run: |
          mkdir -p "$LOG_DIR"
          python - <<'PY'
          import importlib
          import sys

          modules = [
              "server",
              "api.app",
              "api.routes",
              "api.service",
              "api.cycle_scheduler",
              "api.learning_scheduler",
              "api.valuation",
              "api.routers.health",
              "api.routers.admin",
              "api.routers.research",
              "api.routers.crypto",
              "api.routers.forex",
              "api.routers.swing",
              "api.routers.portfolio",
              "api.routers.market",
          ]
          failed = []
          for name in modules:
              try:
                  importlib.import_module(name)
                  print(f"ok   {name}")
              except Exception as exc:  # noqa: BLE001 - report every failure
                  failed.append((name, repr(exc)))
                  print(f"FAIL {name}: {exc!r}")
          if failed:
              sys.exit(1)
          PY

  worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Cloudflare Worker unit tests
        run: node --experimental-default-type=module tests/test_worker_scheduled.js

      - name: Run trade statistics regression tests
        run: node tests/test_stats_calculation.js

      - name: Run institutional flow helper regression tests
        run: node tests/test_tradeflow_helper.js

  tradvix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tradvix-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tradvix-app/package-lock.json

      - name: Install and verify
        run: |
          npm ci
          npm run lint
          npm run build
