name: Autonomous Paper Trading Cycle

on:
  schedule:
    # 03:25 UTC = 08:55 IST (Pre-Market 199-Bar Indicator State Caching)
    - cron: '25 3 * * 1-5'
    # 03:45 UTC = 09:15 IST (Market Open)
    - cron: '45 3 * * 1-5'
    # 04:00 - 09:40 UTC = 09:30 - 15:10 IST (Active Trading Window)
    - cron: '*/20 4-9 * * 1-5'
    # 09:45 UTC = 15:15 IST (Mandatory EOD Square-Off Cycle)
    - cron: '45 9 * * 1-5'
    # 10:00 UTC = 15:30 IST (Market Close / Initial EOD Management)
    - cron: '0 10 * * 1-5'
    # 10:12 UTC = 15:42 IST (Official NSE VWAP Settlement & EOD Snapshot Freeze)
    - cron: '12 10 * * 1-5'
    # Weekends / Crypto: Run every 3 hours for continuous 24/7 crypto scanning
    - cron: '0 */3 * * 0,6'

  workflow_dispatch:
    inputs:
      universe:
        description: 'Asset Universe to scan'
        required: true
        default: 'tier1'
        type: choice
        options:
          - tier1
          - nse
          - crypto
          - all
      force_scan:
        description: 'Bypass market session hours check'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (calculate signals but do not execute paper trades)'
        required: false
        type: boolean
        default: false
      settlement_sweep:
        description: 'Execute official 15:42 IST settlement sweep'
        required: false
        type: boolean
        default: false
      premarket_prep:
        description: 'Execute 08:55 IST pre-market preparation'
        required: false
        type: boolean
        default: false

  repository_dispatch:
    types: [run_autonomous_cycle]

concurrency:
  group: autonomous-paper-worker
  cancel-in-progress: false

jobs:
  run-cycle:
    name: Execute Autonomous Paper Worker Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Single Autonomous Cycle
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTONOMOUS_TRADING_ENABLED: "true"
          AUTONOMOUS_MAX_POSITIONS: "8"
          PYTHONUNBUFFERED: "1"
          EVENT_NAME: ${{ github.event_name }}
          INPUT_UNIVERSE: ${{ github.event.inputs.universe }}
          INPUT_FORCE_SCAN: ${{ github.event.inputs.force_scan }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_SETTLEMENT_SWEEP: ${{ github.event.inputs.settlement_sweep }}
          INPUT_PREMARKET_PREP: ${{ github.event.inputs.premarket_prep }}
          PAYLOAD_UNIVERSE: ${{ github.event.client_payload.universe }}
          PAYLOAD_FORCE_SCAN: ${{ github.event.client_payload.force_scan }}
        run: |
          ARGS=()

          # Handle workflow_dispatch inputs
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_UNIVERSE" ]; then
              ARGS+=(--universe "$INPUT_UNIVERSE")
            fi
            if [ "$INPUT_FORCE_SCAN" = "true" ]; then
              ARGS+=(--force-scan)
            fi
            if [ "$INPUT_DRY_RUN" = "true" ]; then
              ARGS+=(--dry-run)
            fi
            if [ "$INPUT_SETTLEMENT_SWEEP" = "true" ]; then
              ARGS+=(--settlement-sweep)
            fi
            if [ "$INPUT_PREMARKET_PREP" = "true" ]; then
              ARGS+=(--premarket-prep)
            fi
          elif [ "$EVENT_NAME" = "repository_dispatch" ]; then
            # Handle client_payload from repository_dispatch
            if [ -n "$PAYLOAD_UNIVERSE" ]; then
              ARGS+=(--universe "$PAYLOAD_UNIVERSE")
            fi
            if [ "$PAYLOAD_FORCE_SCAN" = "true" ]; then
              ARGS+=(--force-scan)
            fi
          else
            # Default scheduled cron execution: tier-1 universe
            ARGS=(--universe tier1)
          fi

          echo "Executing: python scripts/autonomous_cycle.py ${ARGS[*]}"
          python scripts/autonomous_cycle.py "${ARGS[@]}"
