name: Scheduled AI Model Training & Publish

on:
  schedule:
    # Every Sunday at 00:00 UTC (05:30 IST) — Off-market weekly calibration
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      asset_type:
        description: 'Asset class to train'
        required: true
        default: 'nse'
        type: choice
        options:
          - nse
          - crypto
      symbols:
        description: 'Comma-separated symbols (empty for default leaders)'
        required: false
        default: ''
        type: string
      quick:
        description: 'Fast CPU fit (skip Optuna hyperparameter search)'
        required: false
        type: boolean
        default: true

jobs:
  train-and-publish:
    name: Train Models & Publish to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train Models & Publish Bundle
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INPUT_ASSET_TYPE: ${{ github.event.inputs.asset_type }}
          INPUT_SYMBOLS: ${{ github.event.inputs.symbols }}
          INPUT_QUICK: ${{ github.event.inputs.quick }}
        run: |
          ASSET_TYPE="${INPUT_ASSET_TYPE:-nse}"
          ARGS=(--asset-type "$ASSET_TYPE")
          if [ -n "$INPUT_SYMBOLS" ]; then
            ARGS+=(--symbols "$INPUT_SYMBOLS")
          fi
          if [ "$INPUT_QUICK" = "false" ]; then
            ARGS+=(--optuna --trials 15)
          else
            ARGS+=(--quick)
          fi

          echo "🚀 Launching model training pipeline..."
          python scripts/train_and_publish.py \
            "${ARGS[@]}" \
            --publish \
            --source github_actions
