name: Production Backend Keep-Alive

on:
  # Cron disabled to conserve GitHub Actions monthly quota on private repository.
  # 24/7 background keep-alive is handled internally by FastAPI async self-ping and Cloudflare Worker traffic.
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Endpoint URL to ping'
        required: true
        default: 'https://trading-api-n1wt.onrender.com/api/health'

concurrency:
  group: backend-keep-alive
  cancel-in-progress: true

jobs:
  ping-backend:
    name: Ping Render Backend
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Ping Backend Health Endpoint
        run: |
          TARGET="${{ github.event.inputs.target_url || 'https://trading-api-n1wt.onrender.com/api/health' }}"
          echo "Pinging target: $TARGET"
          
          # 90s max-time to gracefully accommodate Render cold-boot if asleep
          HTTP_RESULT=$(curl -sS --max-time 90 -w "\nHTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}s" "$TARGET" || echo "CURL_FAILED")
          
          echo "$HTTP_RESULT"
          
          STATUS=$(echo "$HTTP_RESULT" | grep "HTTP_STATUS" | cut -d':' -f2 || echo "UNKNOWN")
          
          if [ "$STATUS" = "200" ]; then
            echo "SUCCESS: Backend is awake and healthy."
          else
            echo "Backend status: $STATUS. Retrying in 10s to ensure container settles..."
            sleep 10
            curl -sS --max-time 60 "$TARGET" || true
          fi
