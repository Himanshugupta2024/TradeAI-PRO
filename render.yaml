# Free-tier web services cannot attach persistent disks (disks require a paid instance).
# SQLite here is ephemeral: data resets on redeploy/restart. For durable DB, add
# Render Postgres and set DATABASE_URL from the database connection string.
services:
  - type: web
    name: trading-api
    env: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Small Render instances: avoid BLAS oversubscription during numpy/scipy import.
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
      - key: DATABASE_URL
        value: sqlite:////tmp/trading.db
      - key: HEALTH_FILE
        value: health.json
      - key: CONTEXT_CACHE_FILE
        value: context_cache.json
      - key: NEWS_CACHE_FILE
        value: news_cache.json
      - key: DAILY_API_USAGE_FILE
        value: daily_api_usage.json
      - key: CONTEXT_USE_PAID_APIS
        value: false
      - key: SCREENER_TASK_ENABLED
        value: false
      - key: MORNING_SCAN_TASK_ENABLED
        value: false
      - key: SELF_PING_ENABLED
        value: false
      - key: NSE_SYMBOL_LIMIT
        value: 20
      - key: MARKETAUX_API_KEY
        sync: false
