# Free-tier web services cannot attach persistent disks (disks require a paid instance).
# SQLite is ephemeral: data resets on redeploy/restart. In production, configure
# Render Postgres or Supabase PostgreSQL and set DATABASE_URL from the database connection string.
services:
  - type: web
    name: trading-api
    env: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PYTHONWARNINGS
        value: "ignore:::yfinance,ignore::DeprecationWarning"
      # Small Render instances: avoid BLAS oversubscription during numpy/scipy import.
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
      # Persistent cloud database (Render PostgreSQL / Supabase): Set in Render dashboard environment
      - key: DATABASE_URL
        sync: false
      # Admin security key for protected routes (/api/paper/trade, /api/refresh, /api/risk/reset-circuit, etc.)
      - key: ADMIN_API_KEY
        sync: false
      # Keep /docs, /redoc and /openapi.json closed in production. Set to "true"
      # only for a deliberate debugging session.
      - key: ENABLE_API_DOCS
        value: "false"
      - key: HEALTH_FILE
        value: health.json
      - key: CONTEXT_CACHE_FILE
        value: context_cache.json
      - key: NEWS_CACHE_FILE
        value: news_cache.json
      - key: DAILY_API_USAGE_FILE
        value: daily_api_usage.json
      - key: CONTEXT_USE_PAID_APIS
        value: false
      # Disable concurrent boot-time batch ML inference to stay strictly under Render 512MB RAM cap
      - key: INITIAL_LOAD_ENABLED
        value: "false"
      - key: BACKGROUND_REFRESH_ENABLED
        value: false
      - key: LIGHTWEIGHT_API_MODE
        value: "true"
      - key: SCREENER_TASK_ENABLED
        value: false
      - key: MORNING_SCAN_TASK_ENABLED
        value: false
      - key: SELF_PING_ENABLED
        value: "true"
      - key: NSE_SYMBOL_LIMIT
        value: 15
      - key: MAX_NSE_CONCURRENCY
        value: 5
      - key: SYMBOL_FETCH_TIMEOUT_SECONDS
        value: 20
