services:
  - type: web
    name: trading-api
    env: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        value: sqlite:///./trading.db
      - key: HEALTH_FILE
        value: health.json
      - key: CONTEXT_CACHE_FILE
        value: context_cache.json
      - key: NEWS_CACHE_FILE
        value: news_cache.json
      - key: DAILY_API_USAGE_FILE
        value: daily_api_usage.json
      - key: CONTEXT_USE_PAID_APIS
        value: true
      - key: MARKETAUX_API_KEY
        sync: false
