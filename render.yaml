# Free-tier web services cannot attach persistent disks (disks require a paid instance).
# SQLite is ephemeral: data resets on redeploy/restart. In production, configure
# Render Postgres or Supabase PostgreSQL and set DATABASE_URL from the database connection string.
services:
  - type: web
    name: trading-api
    env: python
    plan: free
    # Manual deploys only. The live service already runs with auto-deploy off;
    # this file said "true", so any Blueprint sync would have silently re-enabled
    # auto-deploy and shipped every push to production unreviewed. Deploys are
    # triggered deliberately (scripts/trigger_deploy.py) inside a safe window.
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    # Probe the cheap liveness route, not /api/health. The rich health endpoint
    # touches the DB, model registry and feed state; on a 0.1-CPU free instance
    # it can exceed Render's probe timeout, which kills a *healthy* container and
    # produces a restart loop (server_failed -> server_available every few minutes).
    healthCheckPath: /api/health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PYTHONWARNINGS
        value: "ignore:::yfinance,ignore::DeprecationWarning,ignore:The inplace keyword"
      # Small Render instances: avoid BLAS oversubscription during numpy/scipy import.
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
      # Persistent cloud database (Render PostgreSQL / Supabase): Set in Render dashboard environment
      - key: DATABASE_URL
        sync: false
      # Admin security key for protected routes (/api/paper/trade, /api/refresh, /api/risk/reset-circuit, etc.)
      - key: ADMIN_API_KEY
        sync: false
      # Keep /docs, /redoc and /openapi.json closed in production. Set to "true"
      # only for a deliberate debugging session.
      - key: ENABLE_API_DOCS
        value: "false"
      - key: HEALTH_FILE
        value: health.json
      - key: CONTEXT_CACHE_FILE
        value: context_cache.json
      - key: NEWS_CACHE_FILE
        value: news_cache.json
      - key: DAILY_API_USAGE_FILE
        value: daily_api_usage.json
      - key: CONTEXT_USE_PAID_APIS
        value: false
      # Disable concurrent boot-time batch ML inference to stay strictly under Render 512MB RAM cap
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: INITIAL_LOAD_ENABLED
        value: "false"
      - key: BACKGROUND_REFRESH_ENABLED
        value: "true"
      - key: REFRESH_INTERVAL_SEC
        value: "300"
      - key: REFRESH_CYCLE_TIMEOUT_SEC
        value: "240"
      - key: INTRADAY_RVOL_GATE_ENABLED
        value: "false"
      - key: LIGHTWEIGHT_API_MODE
        value: "true"
      - key: ALLOW_LOCAL_AUTONOMOUS_CYCLE
        value: "false"
      - key: SCREENER_TASK_ENABLED
        value: false
      - key: MORNING_SCAN_TASK_ENABLED
        value: false
      - key: SELF_PING_ENABLED
        value: "false"
      - key: NSE_SYMBOL_LIMIT
        value: 40
      - key: MAX_NSE_CONCURRENCY
        value: 1
      - key: ENABLE_PYTORCH_MODELS
        value: "false"
      - key: SYMBOL_FETCH_TIMEOUT_SECONDS
        value: 20
      - key: CRON_SECRET
        sync: false
      # ML Inference Sidecar (Box B) connection
      - key: ML_SIDECAR_URL
        value: "https://trading-ml-8umr.onrender.com"
      - key: ML_INTERNAL_TOKEN
        sync: false
      # Market Data Feed Service (Box C) connection
      - key: FEED_SERVICE_URL
        value: "https://trading-feed.onrender.com"
      - key: FEED_INTERNAL_TOKEN
        sync: false

  # ── Box B: Dedicated ML Inference Sidecar (Render Free ~420MB) ──
  - type: web
    name: trading-ml
    env: python
    plan: free
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn ml_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SERVICE_ROLE
        value: ml_sidecar
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
      - key: LIGHTWEIGHT_API_MODE
        value: "false"
      - key: ENABLE_PYTORCH_MODELS
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: ML_INTERNAL_TOKEN
        sync: false

  # ── Box C: Dedicated Market Data Feed Service (Shoonya WebSocket ~150MB) ──
  - type: web
    name: trading-feed
    env: python
    plan: free
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn feed_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SERVICE_ROLE
        value: feed_service
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: FEED_INTERNAL_TOKEN
        sync: false
      - key: SHOONYA_USERID
        sync: false
      - key: SHOONYA_PASSWORD
        sync: false
      - key: SHOONYA_API_KEY
        sync: false
      - key: SHOONYA_VENDOR_CODE
        sync: false
      - key: SHOONYA_TOTP_SECRET
        sync: false
      - key: SHOONYA_IMEI
        value: "tradeai-feed-01"
